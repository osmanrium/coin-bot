name: Coin Signals

on:
  schedule:
    - cron: "3 * * * *"   # her saat basindan 3 dk sonra (mum kapanisi sonrasi)
  workflow_dispatch:
    inputs:
      test:
        description: "Telegram test mesaji gonder (1)"
        required: false
        default: ""

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scan_bot.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST: ${{ github.event.inputs.test }}
